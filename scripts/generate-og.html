<!doctype html>
<!-- Dev-only OG image generator. Open via the Vite dev server:
     http://localhost:5173/scripts/generate-og.html
     Draws the four localized OG cards with the SAME canvas code as the share
     poster (src/ui/poster.ts). window.postAll() sends each to the local
     receiver on :8787, which writes public/og*.jpg. JPEG at quality 0.82 keeps
     each card small: some chat apps drop preview images over about 300 KB. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>OG generator</title>
    <style>
      @font-face { font-family: 'Anton'; font-style: normal; font-weight: 400; src: url('/fonts/anton-latin.woff2') format('woff2'); }
      @font-face { font-family: 'Inter'; font-style: normal; font-weight: 100 900; src: url('/fonts/inter-latin.woff2') format('woff2'); }
      body { background: #0a1228; color: #eef2ff; font-family: sans-serif; padding: 20px; }
      canvas { max-width: 100%; display: block; margin-bottom: 12px; }
    </style>
  </head>
  <body>
    <p id="status">drawing…</p>
    <script type="module">
      import { drawOgPoster, ensurePosterFonts } from '/src/ui/poster.ts';
      await ensurePosterFonts();
      const VARIANTS = [
        { name: 'og.jpg', tagline: '¿Puedes quedar invicto?', subline: 'Clásico Mundial de Béisbol · 2006–2026 · invictobaseball.com' },
        { name: 'og-en.jpg', tagline: 'Can you run the table?', subline: 'World Baseball Classic · 2006–2026 · invictobaseball.com/en' },
        { name: 'og-ja.jpg', tagline: '7戦全勝、君にできるか？', subline: 'WBC 2006–2026 · invictobaseball.com/ja' },
        { name: 'og-ko.jpg', tagline: '7전 전승, 할 수 있겠어?', subline: 'WBC 2006–2026 · invictobaseball.com/ko' },
      ];
      const canvases = VARIANTS.map((v) => {
        const canvas = document.createElement('canvas');
        drawOgPoster(canvas, { brand: 'INVICTO', tagline: v.tagline, subline: v.subline });
        document.body.append(canvas);
        return { ...v, canvas };
      });
      window.postAll = async () => {
        const results = [];
        for (const { name, canvas } of canvases) {
          await fetch('http://localhost:8787/?name=' + name, { method: 'POST', mode: 'no-cors', body: canvas.toDataURL('image/jpeg', 0.82) });
          results.push(name);
        }
        return results.join(', ');
      };
      document.getElementById('status').textContent = 'ready: call window.postAll()';
    </script>
  </body>
</html>
