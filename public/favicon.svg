<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- The Invicto mark: the gold I of the wordmark on a lit infield diamond.
       The PNG icons (favicon-48, apple-touch-icon, icon-192, icon-512) are renders of this file. -->
  <defs>
    <radialGradient id="sky" cx="256" cy="0" r="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1d3170"/>
      <stop offset="0.75" stop-color="#0a1228"/>
    </radialGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f3373"/>
      <stop offset="1" stop-color="#121f47"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd87a"/>
      <stop offset="1" stop-color="#f5b942"/>
    </linearGradient>
    <filter id="glow" x="-200%" y="-50%" width="500%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#sky)"/>
  <path d="M256 48 L464 256 L256 464 L48 256 Z" fill="url(#field)" stroke="#f5b942" stroke-width="16" stroke-linejoin="round"/>
  <rect x="224" y="124" width="64" height="264" fill="#f5b942" opacity="0.7" filter="url(#glow)"/>
  <rect x="224" y="124" width="64" height="264" fill="url(#gold)"/>
</svg>
